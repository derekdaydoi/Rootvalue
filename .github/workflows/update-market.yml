name: Rootvalue market flow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market.py'
      - 'scripts/update_data.py'
      - 'config/watchlist.json'
      - '.github/workflows/update-market.yml'
  schedule:
    - cron: '20 9 * * 1-5'   # 16:20 ICT, after VN cash-market close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootvalue-data-write
  cancel-in-progress: false

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_INTERACTIVE: '0'
      VNSTOCK_LANGUAGE: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh market flow and investigation picks
        run: python scripts/update_market.py

      - name: Commit market snapshot if changed
        run: |
          if git diff --quiet -- data/rootvalue.json; then
            echo "No market data changes"
          else
            git config user.name "rootvalue-bot"
            git config user.email "rootvalue-bot@users.noreply.github.com"
            git add data/rootvalue.json
            git commit -m "data: refresh Rootvalue market flow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
