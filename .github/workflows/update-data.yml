name: Rootvalue data + Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/rootvalue.json'
  schedule:
    - cron: '20 9 * * 1-5'   # 16:20 ICT, after VN cash-market close
    - cron: '15 23 * * *'    # 06:15 ICT, refresh overnight/macro context
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rootvalue-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install data dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh Rootvalue snapshot
        run: python scripts/update_data.py

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- data/rootvalue.json; then
            echo "No data changes"
          else
            git config user.name "rootvalue-bot"
            git config user.email "rootvalue-bot@users.noreply.github.com"
            git add data/rootvalue.json
            git commit -m "data: refresh Rootvalue snapshot"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
