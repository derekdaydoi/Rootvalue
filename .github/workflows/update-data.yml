name: Rootvalue company foundation

on:
  schedule:
    - cron: '15 23 * * 6'    # Sunday 06:15 ICT (Saturday 23:15 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootvalue-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VNSTOCK_INTERACTIVE: '0'
      VNSTOCK_LANGUAGE: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 8Y company + macro foundation
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/build_foundation.py

      - name: Repair empty financial statements
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/repair_financials.py

      - name: Publish foundation to frontend snapshot
        run: python scripts/publish_foundation.py

      - name: Build multi-period company dashboard dataset
        run: python scripts/build_company_dashboard.py

      - name: Validate generated data contracts
        run: python scripts/validate_data_contracts.py

      - name: Report foundation readiness (coverage may be incomplete)
        continue-on-error: true
        run: python scripts/validate_foundation.py

      - name: Show QC manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/foundation/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
            'foundation_ready': d.get('foundation_ready'),
            'company_qc': d.get('company_qc'),
            'macro_qc': d.get('macro_qc'),
            'access': d.get('access')
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit refreshed foundation if changed
        run: |
          if git diff --quiet -- data/foundation data/rootvalue.json data/company_dashboard.json && [ -z "$(git ls-files --others --exclude-standard data/foundation data/company_dashboard.json)" ]; then
            echo "No data changes"
          else
            git config user.name "rootvalue-bot"
            git config user.email "rootvalue-bot@users.noreply.github.com"
            git add data/foundation data/rootvalue.json data/company_dashboard.json
            git commit -m "data: refresh Rootvalue foundation"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo "Unable to publish foundation snapshot after retries"
            exit 1
          fi
