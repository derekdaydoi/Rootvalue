name: Rootvalue data foundation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_foundation.py'
      - 'scripts/repair_financials.py'
      - 'scripts/repair_sbv_official.py'
      - 'scripts/build_sbv_history.py'
      - 'scripts/build_company_dashboard.py'
      - 'scripts/publish_foundation.py'
      - 'scripts/validate_foundation.py'
      - 'config/foundation.json'
      - 'config/watchlist.json'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '15 23 * * *'    # 06:15 ICT daily: financial + SBV foundation refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootvalue-foundation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_INTERACTIVE: '0'
      VNSTOCK_LANGUAGE: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 8Y company + SBV foundation
        run: python scripts/build_foundation.py

      - name: Repair empty financial statements
        run: python scripts/repair_financials.py

      - name: Parse official SBV tables with vi-VN numeric locale
        run: python scripts/repair_sbv_official.py

      - name: Persist official SBV trajectory
        run: python scripts/build_sbv_history.py

      - name: Publish foundation to frontend snapshot
        run: python scripts/publish_foundation.py

      - name: Build multi-period company dashboard dataset
        run: python scripts/build_company_dashboard.py

      - name: Strict QC report
        run: python scripts/validate_foundation.py || true

      - name: Show QC manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/foundation/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
            'foundation_ready': d.get('foundation_ready'),
            'company_qc': d.get('company_qc'),
            'macro_qc': d.get('macro_qc'),
            'access': d.get('access')
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit refreshed foundation if changed
        run: |
          if git diff --quiet -- data/foundation data/rootvalue.json data/company_dashboard.json && [ -z "$(git ls-files --others --exclude-standard data/foundation data/company_dashboard.json)" ]; then
            echo "No data changes"
          else
            git config user.name "rootvalue-bot"
            git config user.email "rootvalue-bot@users.noreply.github.com"
            git add data/foundation data/rootvalue.json data/company_dashboard.json
            git commit -m "data: refresh Rootvalue foundation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
