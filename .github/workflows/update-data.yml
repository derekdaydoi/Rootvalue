name: Rootvalue data refresh

on:
  schedule:
    - cron: '20 9 * * 1-5'   # 16:20 ICT, after VN cash-market close
    - cron: '15 23 * * *'    # 06:15 ICT, overnight/macro refresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootvalue-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
      VNSTOCK_INTERACTIVE: '0'
      VNSTOCK_LANGUAGE: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install data dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh Rootvalue snapshot
        run: python scripts/update_data.py

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- data/rootvalue.json; then
            echo "No data changes"
          else
            git config user.name "rootvalue-bot"
            git config user.email "rootvalue-bot@users.noreply.github.com"
            git add data/rootvalue.json
            git commit -m "data: refresh Rootvalue snapshot"
            git push
          fi
