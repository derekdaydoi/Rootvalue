name: Rootvalue company dashboard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_company_dashboard.py'
      - 'data/foundation/companies/**'
      - 'config/watchlist.json'
      - '.github/workflows/build-dashboard.yml'
  schedule:
    - cron: '45 23 * * *'   # 06:45 ICT; rebuild from the latest stored foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootvalue-company-dashboard
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build chart dataset from stored financial statements
        run: python scripts/build_company_dashboard.py
      - name: Commit dashboard snapshot if changed
        run: |
          if git diff --quiet -- data/company_dashboard.json && [ -z "$(git ls-files --others --exclude-standard data/company_dashboard.json)" ]; then
            echo "No dashboard changes"
            exit 0
          fi
          git config user.name "rootvalue-bot"
          git config user.email "rootvalue-bot@users.noreply.github.com"
          git add data/company_dashboard.json
          git commit -m "data: rebuild Rootvalue company dashboard"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
