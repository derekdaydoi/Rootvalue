name: Rootvalue official SBV daily

on:
  schedule:
    - cron: '15 23 * * *'    # 06:15 ICT daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rootvalue-data-write
  cancel-in-progress: false

jobs:
  refresh-official-sbv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight SBV dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.32,<3' 'lxml>=5.3,<7'

      - name: Fetch and validate official SBV tables
        run: python scripts/repair_sbv_official.py

      - name: Persist official source-dated SBV trajectory
        run: python scripts/build_sbv_history.py

      - name: Publish synchronized frontend snapshot
        run: python scripts/publish_foundation.py

      - name: Validate generated data contracts
        run: python scripts/validate_data_contracts.py

      - name: Report foundation readiness (coverage may be incomplete)
        continue-on-error: true
        run: python scripts/validate_foundation.py

      - name: Commit official SBV snapshot if changed
        run: |
          if git diff --quiet -- data/foundation/macro.json data/foundation/sbv_history.json data/rootvalue.json && [ -z "$(git ls-files --others --exclude-standard data/foundation/macro.json data/foundation/sbv_history.json data/rootvalue.json)" ]; then
            echo "No official SBV data changes"
          else
            git config user.name "rootvalue-bot"
            git config user.email "rootvalue-bot@users.noreply.github.com"
            git add data/foundation/macro.json data/foundation/sbv_history.json data/rootvalue.json
            git commit -m "data: refresh official SBV snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            echo "Unable to publish official SBV snapshot after retries"
            exit 1
          fi
