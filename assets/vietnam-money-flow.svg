<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ dòng tiền hệ thống Việt Nam</title>
  <desc id="desc">Sơ đồ Rootvalue mô tả áp lực bên ngoài, phản ứng NHNN, thanh khoản TT2, bảng cân đối ngân hàng, nguồn vốn TT1, Kho bạc, dân cư, doanh nghiệp và phân bổ tài sản.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 Z" fill="#14614A"/></marker>
    <style>
      .bg{fill:#f7f8f6}.card{fill:#fff;stroke:#cbd5cf;stroke-width:2}.headerCard{fill:#fff;stroke:#d7ded9;stroke-width:2}.primary{fill:#edf5f1;stroke:#14614A;stroke-width:2.4}
      .eyebrow{font:700 14px Arial,sans-serif;fill:#14614A;letter-spacing:1.2px}.title{font:700 27px Arial,sans-serif;fill:#202123}.body{font:17px Arial,sans-serif;fill:#62676b}
      .header{font:700 14px Arial,sans-serif;fill:#14614A;letter-spacing:1.3px}.headline{font:700 29px Arial,sans-serif;fill:#202123}
      .line{stroke:#14614A;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7b8881;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="12" y="12" width="1576" height="906" rx="30" class="bg"/>

  <!-- Header is explicitly contained inside its own card to prevent visual overflow/cropping. -->
  <rect x="70" y="45" width="1355" height="105" rx="18" class="headerCard"/>
  <text x="100" y="80" class="header">ROOTVALUE · DÒNG TIỀN HỆ THỐNG VIỆT NAM</text>
  <text x="100" y="122" class="headline">Tồn lượng → dòng giao dịch → giá của tiền → truyền dẫn</text>

  <rect x="70" y="190" width="270" height="140" rx="20" class="card"/>
  <text x="100" y="230" class="eyebrow">BÊN NGOÀI</text><text x="100" y="268" class="title">Ngoại lực</text><text x="100" y="300" class="body">Fed · USD · thương mại · FDI · FII</text>

  <rect x="405" y="190" width="270" height="140" rx="20" class="card"/>
  <text x="435" y="230" class="eyebrow">ÁP LỰC TỶ GIÁ</text><text x="435" y="268" class="title">USD/VND</text><text x="435" y="300" class="body">DXY · dòng vốn · cán cân ngoại tệ</text>

  <rect x="740" y="175" width="310" height="170" rx="20" class="primary"/>
  <text x="775" y="217" class="eyebrow">NGÂN HÀNG NHÀ NƯỚC</text><text x="775" y="259" class="title">NHNN / SBV</text><text x="775" y="293" class="body">FX · OMO · tín phiếu · lãi suất</text><text x="775" y="321" class="body">Phản ứng theo trạng thái hệ thống</text>

  <rect x="1125" y="190" width="300" height="140" rx="20" class="card"/>
  <text x="1157" y="230" class="eyebrow">TÀI KHÓA</text><text x="1157" y="268" class="title">KBNN / Kho bạc</text><text x="1157" y="300" class="body">Thuế · chi tiêu · TGA · trái phiếu</text>

  <path d="M340 260 H405" class="line"/><path d="M675 260 H740" class="line"/><path d="M1125 260 H1050" class="dash"/>

  <rect x="260" y="450" width="300" height="160" rx="20" class="primary"/>
  <text x="294" y="492" class="eyebrow">TT2 · LIÊN NGÂN HÀNG</text><text x="294" y="535" class="title">Thanh khoản cận biên</text><text x="294" y="570" class="body">O/N · 1W · repo · OMO</text>

  <rect x="650" y="425" width="360" height="210" rx="20" class="primary"/>
  <text x="686" y="468" class="eyebrow">BẢNG CÂN ĐỐI NGÂN HÀNG</text><text x="686" y="510" class="title">Big 4 + ngân hàng khác</text><text x="686" y="548" class="body">Tiền gửi · cho vay · vốn · RWA</text><text x="686" y="579" class="body">ALM · NIM · thanh khoản · CAR</text><text x="686" y="610" class="body">Ràng buộc thanh khoản ≠ ràng buộc vốn</text>

  <rect x="1100" y="450" width="325" height="160" rx="20" class="card"/>
  <text x="1134" y="492" class="eyebrow">TT1 · KHÁCH HÀNG</text><text x="1134" y="535" class="title">Huy động &amp; tín dụng</text><text x="1134" y="570" class="body">Dân cư · doanh nghiệp · lãi suất</text>

  <path d="M895 345 V390 H410 V450" class="line"/><path d="M1275 330 V385 H830 V425" class="dash"/><path d="M560 530 H650" class="line"/><path d="M1010 530 H1100" class="line"/>

  <rect x="190" y="745" width="300" height="135" rx="20" class="card"/>
  <text x="224" y="786" class="eyebrow">DÂN CƯ</text><text x="224" y="827" class="title">Tiền gửi · tiêu dùng</text><text x="224" y="857" class="body">Tiết kiệm · vàng · BĐS · cổ phiếu</text>

  <rect x="620" y="745" width="330" height="135" rx="20" class="card"/>
  <text x="654" y="786" class="eyebrow">DOANH NGHIỆP</text><text x="654" y="827" class="title">Vốn lưu động · đầu tư</text><text x="654" y="857" class="body">Capex · lương · thuế · tiền gửi</text>

  <rect x="1080" y="730" width="345" height="165" rx="20" class="card"/>
  <text x="1114" y="772" class="eyebrow">PHÂN BỔ TÀI SẢN</text><text x="1114" y="814" class="title">Tiền đi vào đâu?</text><text x="1114" y="849" class="body">Tiền gửi · trái phiếu · cổ phiếu</text><text x="1114" y="877" class="body">BĐS · vàng · margin</text>

  <path d="M1210 610 V675 H340 V745" class="dash"/>
  <path d="M1300 610 V685 H785 V745" class="line"/>
  <path d="M950 812 H1080" class="line"/>
  <path d="M490 812 H560 V710 H1035 V845 H1080" class="dash"/>
</svg>
