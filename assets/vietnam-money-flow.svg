<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Vietnam monetary stock-flow map</title>
<desc id="desc">Original Rootvalue diagram connecting external flows, SBV, Treasury, interbank liquidity, commercial banks, households, corporates and asset allocation.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#14614A"/></marker><style>.b{fill:#fff;stroke:#cdd6d1;stroke-width:2}.g{fill:#edf5f1;stroke:#14614A;stroke-width:2}.t{font:600 24px Arial,sans-serif;fill:#202123}.s{font:16px Arial,sans-serif;fill:#61656b}.l{stroke:#14614A;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#7c8882;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#a)}.h{font:700 13px Arial,sans-serif;fill:#14614A;letter-spacing:1px}</style></defs>
<rect width="1400" height="760" rx="28" fill="#f7f8f6"/>
<text x="70" y="62" class="h">ROOTVALUE · VIETNAM MONEY SYSTEM</text>
<text x="70" y="99" class="t">Stock → flow → price of money → transmission</text>

<rect x="65" y="160" width="235" height="120" rx="18" class="b"/><text x="92" y="200" class="h">EXTERNAL</text><text x="92" y="235" class="t">Khu vực bên ngoài</text><text x="92" y="263" class="s">Fed · USD · trade · FDI · FII</text>
<rect x="395" y="145" width="250" height="150" rx="18" class="g"/><text x="425" y="185" class="h">CENTRAL BANK</text><text x="425" y="222" class="t">NHNN / SBV</text><text x="425" y="253" class="s">FX · OMO · bills · policy rates</text>
<rect x="750" y="145" width="250" height="150" rx="18" class="b"/><text x="780" y="185" class="h">FISCAL</text><text x="780" y="222" class="t">KBNN / Treasury</text><text x="780" y="253" class="s">Tax · spending · TGA · bonds</text>
<rect x="1085" y="145" width="245" height="150" rx="18" class="b"/><text x="1115" y="185" class="h">GLOBAL PRICE</text><text x="1115" y="222" class="t">USD/VND pressure</text><text x="1115" y="253" class="s">DXY · capital flow · reserves</text>

<rect x="395" y="365" width="250" height="145" rx="18" class="g"/><text x="425" y="403" class="h">TT2</text><text x="425" y="439" class="t">Interbank liquidity</text><text x="425" y="470" class="s">O/N · 1W · OMO · repo</text>
<rect x="750" y="350" width="250" height="175" rx="18" class="g"/><text x="780" y="388" class="h">BANK BALANCE SHEETS</text><text x="780" y="425" class="t">Big 4 + other banks</text><text x="780" y="457" class="s">Deposits · loans · capital · RWA</text><text x="780" y="486" class="s">ALM · NIM · liquidity constraints</text>
<rect x="1085" y="365" width="245" height="145" rx="18" class="b"/><text x="1115" y="403" class="h">TT1</text><text x="1115" y="439" class="t">Deposits & credit</text><text x="1115" y="470" class="s">Households · corporates</text>

<rect x="395" y="600" width="250" height="105" rx="18" class="b"/><text x="425" y="638" class="h">HOUSEHOLDS</text><text x="425" y="672" class="t">Tiền gửi · tiêu dùng</text>
<rect x="750" y="600" width="250" height="105" rx="18" class="b"/><text x="780" y="638" class="h">CORPORATES</text><text x="780" y="672" class="t">WC · capex · payroll</text>
<rect x="1085" y="585" width="245" height="120" rx="18" class="b"/><text x="1115" y="623" class="h">ALLOCATION</text><text x="1115" y="657" class="t">Bonds · equity · RE</text><text x="1115" y="685" class="s">Gold · deposits · margin</text>

<path d="M300 220 H395" class="l"/><path d="M645 220 H750" class="d"/><path d="M1000 220 H1085" class="l"/><path d="M1085 260 C1015 300 980 320 930 350" class="d"/>
<path d="M520 295 V365" class="l"/><path d="M875 295 V350" class="l"/><path d="M645 438 H750" class="l"/><path d="M1000 438 H1085" class="l"/>
<path d="M875 525 V600" class="l"/><path d="M1205 510 V585" class="l"/><path d="M1085 470 C1000 540 965 575 930 600" class="d"/><path d="M1085 470 C910 548 750 560 645 625" class="d"/>
<path d="M750 655 H645" class="d"/><path d="M1000 655 H1085" class="l"/>
<text x="320" y="205" class="s">FX / capital</text><text x="542" y="333" class="s">policy</text><text x="670" y="423" class="s">liquidity distribution</text><text x="1010" y="423" class="s">funding / credit</text>
</svg>
