<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ dòng tiền hệ thống Việt Nam</title>
  <desc id="desc">Sơ đồ Rootvalue mô tả dòng tiền từ ngoại lực, tỷ giá, NHNN, Kho bạc, thanh khoản liên ngân hàng, bảng cân đối ngân hàng, huy động tín dụng, dân cư, doanh nghiệp và phân bổ tài sản.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4 L0,8 Z" fill="#14614A"/></marker>
    <style>
      .panel{fill:#f7f8f6;stroke:#d7ded9;stroke-width:2}.card{fill:#fff;stroke:#cbd5cf;stroke-width:2}.primary{fill:#edf5f1;stroke:#14614A;stroke-width:2.4}
      .k{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#14614A;letter-spacing:1.15px}.t{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#202123}.tc{font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#202123}.s{font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#62676b}
      .line{stroke:#14614A;stroke-width:4;fill:none;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:square}.dash{stroke:#7b8881;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow);stroke-linejoin:round}
    </style>
  </defs>

  <rect x="36" y="28" width="1528" height="704" rx="30" class="panel"/>

  <g transform="translate(82 72)"><rect width="270" height="145" rx="20" class="card"/><text x="30" y="38" class="k">BÊN NGOÀI</text><text x="30" y="77" class="t">Ngoại lực</text><text x="30" y="111" class="s">Fed · USD · thương mại · FDI · FII</text></g>
  <g transform="translate(417 72)"><rect width="270" height="145" rx="20" class="card"/><text x="30" y="38" class="k">ÁP LỰC TỶ GIÁ</text><text x="30" y="77" class="t">USD/VND</text><text x="30" y="111" class="s">DXY · dòng vốn · cán cân ngoại tệ</text></g>
  <g transform="translate(752 57)"><rect width="320" height="175" rx="20" class="primary"/><text x="34" y="42" class="k">NGÂN HÀNG NHÀ NƯỚC</text><text x="34" y="83" class="t">NHNN / SBV</text><text x="34" y="118" class="s">FX · OMO · tín phiếu · lãi suất</text><text x="34" y="148" class="s">Phản ứng theo trạng thái hệ thống</text></g>
  <g transform="translate(1137 72)"><rect width="300" height="145" rx="20" class="card"/><text x="32" y="38" class="k">TÀI KHÓA</text><text x="32" y="77" class="t">KBNN / Kho bạc</text><text x="32" y="111" class="s">Thuế · chi tiêu · TGA · trái phiếu</text></g>

  <path d="M352 144 H417" class="line"/><path d="M687 144 H752" class="line"/><path d="M1137 144 H1072" class="dash"/>

  <g transform="translate(245 315)"><rect width="320" height="165" rx="20" class="primary"/><text x="32" y="39" class="k">TT2 · LIÊN NGÂN HÀNG</text><text x="32" y="80" class="tc">Thanh khoản cận biên</text><text x="32" y="118" class="s">O/N · 1W · repo · OMO</text></g>
  <g transform="translate(650 290)"><rect width="380" height="215" rx="20" class="primary"/><text x="34" y="42" class="k">BẢNG CÂN ĐỐI NGÂN HÀNG</text><text x="34" y="83" class="tc">Big 4 + ngân hàng khác</text><text x="34" y="121" class="s">Tiền gửi · cho vay · vốn · RWA</text><text x="34" y="153" class="s">ALM · NIM · thanh khoản · CAR</text><text x="34" y="185" class="s">Ràng buộc thanh khoản / vốn</text></g>
  <g transform="translate(1110 315)"><rect width="330" height="165" rx="20" class="card"/><text x="32" y="39" class="k">TT1 · KHÁCH HÀNG</text><text x="32" y="80" class="t">Huy động &amp; tín dụng</text><text x="32" y="118" class="s">Dân cư · doanh nghiệp · lãi suất</text></g>

